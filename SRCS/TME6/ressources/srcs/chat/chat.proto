syntax = "proto3";
package srcs.chat;

import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";

option java_multiple_files = true;

message Coords {
	string pseudo = 1;
	string ip = 2;
	int32 port = 3;
}

message Users {
	repeated string pseudo = 1;
}

message Message {
	Users users = 1;
	string message = 2;
}

service ChatServer {
	rpc subscribe (Coords) returns (google.protobuf.BoolValue);
	rpc unsubscribe (google.protobuf.StringValue) returns (google.protobuf.Empty);
	rpc getlist (google.protobuf.Empty) returns (Users);
	rpc send (Message) returns (google.protobuf.Int32Value);
}

service ChatClient { 
	rpc newMessage (Message) returns (google.protobuf.Empty);
}